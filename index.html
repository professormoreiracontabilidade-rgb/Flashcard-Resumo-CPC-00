<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>40 Flashcards-Resumo CPC 00</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#18222c}
.app{max-width:760px;margin:auto;padding:12px 12px 28px}
header{text-align:center;padding:5px 3px 10px}
h1{font-size:21px;color:#123b66;margin:3px}
header p{font-size:12px;font-weight:800;color:#65717b;margin:5px}
.progress{height:8px;background:#dce4eb;border-radius:99px;overflow:hidden;margin:8px 0}
#bar{height:100%;background:#174f82;width:2.5%;transition:.25s}
#count{text-align:center;font-weight:900;color:#174f82;margin:9px}
.scene{perspective:1400px}
.card{position:relative;width:100%;height:500px;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px 18px;box-shadow:0 10px 26px rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:center;overflow:auto}
.front{background:#cfeaff;color:#123b66}
.back{background:#ffd7e5;color:#64253c;transform:rotateY(180deg)}
.tag{position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.72);padding:7px 12px;border-radius:99px;font-size:11px;font-weight:900}
.question{white-space:pre-line;text-align:center;font-size:24px;line-height:1.42;font-weight:900;padding:40px 4px}
.answer{background:rgba(255,255,255,.75);border:2px solid #b94d76;border-radius:15px;padding:15px;font-size:20px;line-height:1.4;font-weight:900;text-align:center;margin:45px 0 14px}
.comment{background:rgba(255,255,255,.55);border-left:6px solid #8b284d;border-radius:10px;padding:14px;font-size:16px;line-height:1.5;text-align:left}
.tap{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;opacity:.72}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.controls button{min-height:50px;border:0;border-radius:12px;font-size:13px;font-weight:900;cursor:pointer}
.prev{background:#fff;color:#123b66;border:2px solid #123b66!important}
.reset{background:#ffd65a;color:#222}
.next{background:#123b66;color:#fff}
footer{text-align:center;font-size:11px;font-weight:700;color:#69737c;margin-top:13px}
@media(max-width:480px){
 .card{height:520px}
 .question{font-size:21px}
 .answer{font-size:17px}
 .comment{font-size:14px}
}
</style>
</head>
<body>
<main class="app">
<header><h1>40 FLASHCARDS-RESUMO — CPC 00 (R2)</h1><p>CURSO DE CONTABILIDADE • PROFESSOR MOREIRA</p></header>
<div class="progress"><div id="bar"></div></div>
<div id="count">FLASHCARD 1 DE 40</div>
<div class="scene">
  <div class="card" id="card" role="button" tabindex="0">
    <section class="face front">
      <div class="tag">FRENTE • PONTO-CHAVE</div>
      <div class="question" id="question">Carregando...</div>
      <div class="tap">TOQUE NO CARTÃO PARA VIRAR</div>
    </section>
    <section class="face back">
      <div class="tag">VERSO • RESPOSTA COMENTADA</div>
      <div class="answer" id="answer"></div>
      <div class="comment" id="comment"></div>
      <div class="tap">TOQUE NOVAMENTE PARA VOLTAR</div>
    </section>
  </div>
</div>
<div class="controls">
<button class="prev" id="prev">← VOLTAR</button>
<button class="reset" id="reset">↻ REINICIAR</button>
<button class="next" id="next">AVANÇAR →</button>
</div>
<footer>Frente azul-clara • Verso rosa-clara • Efeito 3D</footer>
</main>

<script id="cards-data" type="application/json">[{"num": 1, "front": "TEMPESTIVIDADE\n\nInformação reconhecida tarde demais prejudica qual característica qualitativa?", "gab": "B", "correct": "B) tempestividade.", "comment": "Tempestividade: a informação precisa chegar a tempo de influenciar decisões. Adiar o reconhecimento pode reduzir sua utilidade."}, {"num": 2, "front": "OBJETIVO DO RELATÓRIO FINANCEIRO\n\nQual é a finalidade principal do relatório financeiro para fins gerais?", "gab": "E", "correct": "E) fornecer informações financeiras sobre a entidade que reporta que sejam úteis a seus usuários primários na tomada de decisões referente à oferta de recursos à entidade.", "comment": "O objetivo é fornecer informação financeira útil sobre a entidade que reporta aos usuários primários para decisões sobre oferta de recursos."}, {"num": 3, "front": "USUÁRIOS PRIMÁRIOS\n\nQuem são os principais usuários das informações financeiras?", "gab": "B", "correct": "B) investidores e credores.", "comment": "Usuários primários: investidores, credores por empréstimos e outros credores, existentes e potenciais."}, {"num": 4, "front": "ACESSO À INFORMAÇÃO\n\nPor que investidores e credores dependem dos relatórios financeiros?", "gab": "D", "correct": "D) devem se basear nestes relatórios para muitas das informações financeiras de que necessitam.", "comment": "Muitos usuários primários não podem exigir informações diretamente; por isso dependem dos relatórios financeiros."}, {"num": 5, "front": "RECURSO ECONÔMICO\n\nNo CPC 00, o que caracteriza um recurso econômico?", "gab": "C", "correct": "C) um direito que tem o potencial de produzir benefícios econômicos.", "comment": "Recurso econômico é um direito com potencial de produzir benefícios econômicos. Essa ideia sustenta a definição de ativo."}, {"num": 6, "front": "REPRESENTAÇÃO FIDEDIGNA\n\nSe uma estimativa é manipulada para favorecer a administração, o que é comprometido?", "gab": "C", "correct": "C) não pode ser, uma vez que não é neutra.", "comment": "Representação fidedigna exige neutralidade. Ajustar estimativa para favorecer a administração compromete essa neutralidade."}, {"num": 7, "front": "TEMPESTIVIDADE\n\nQuando a informação precisa estar disponível para ser útil?", "gab": "D", "correct": "D) tempestividade.", "comment": "O ponto central é a tempestividade: informação disponível em tempo de influenciar a decisão."}, {"num": 8, "front": "ENTIDADE QUE REPORTA\n\nComo controladora e controladas aparecem nas demonstrações consolidadas?", "gab": "D", "correct": "D) da controladora e de suas controladas, como uma única entidade que reporta.", "comment": "Nas demonstrações consolidadas, controladora e controladas são apresentadas como uma única entidade que reporta."}, {"num": 9, "front": "PATRIMÔNIO LÍQUIDO\n\nComo o CPC 00 define patrimônio líquido?", "gab": "A", "correct": "A) a dedução de seus passivos.", "comment": "Patrimônio líquido é a participação residual nos ativos depois de deduzidos todos os passivos."}, {"num": 10, "front": "REPRESENTAÇÃO FIDEDIGNA\n\nQuais são seus três atributos?", "gab": "A", "correct": "A) completa, neutra e isenta de erros.", "comment": "Representação fidedigna exige informação completa, neutra e isenta de erros."}, {"num": 11, "front": "ELEMENTOS DAS DEMONSTRAÇÕES\n\nComo identificar corretamente ativo, passivo, PL, receita e despesa?", "gab": "A", "correct": "A) II – III – I.", "comment": "Associe cada definição ao elemento correspondente, observando os efeitos sobre ativos, passivos e patrimônio líquido."}, {"num": 12, "front": "CONTINUIDADE OPERACIONAL\n\nQual é a premissa básica da continuidade?", "gab": "B", "correct": "B) entrar em liquidação ou deixar de negociar.", "comment": "Continuidade operacional pressupõe que a entidade continuará operando, sem intenção ou necessidade de liquidar ou encerrar atividades."}, {"num": 13, "front": "DECISÕES DOS USUÁRIOS\n\nQue decisões o relatório financeiro ajuda investidores e credores a tomar?", "gab": "E", "correct": "E) comprar, vender ou manter instrumento de patrimônio e de dívida.", "comment": "As decisões incluem comprar, vender ou manter instrumentos de patrimônio/dívida e conceder ou liquidar crédito."}, {"num": 14, "front": "ATIVO\n\nQual é a ideia central da definição de ativo?", "gab": "C", "correct": "C) tem o potencial de produzir benefícios econômicos.", "comment": "Ativo envolve recurso econômico presente controlado pela entidade; recurso econômico é um direito com potencial de gerar benefícios."}, {"num": 15, "front": "RESTRIÇÃO DO CUSTO\n\nQual relação deve existir entre custo e benefício da informação?", "gab": "B", "correct": "B) V – V – F.", "comment": "O custo é uma restrição: os benefícios esperados da informação devem justificar os custos de produzi-la e utilizá-la."}, {"num": 16, "front": "COMPREENSIBILIDADE\n\nQue tipo de usuário é considerado ao avaliar a compreensibilidade?", "gab": "D", "correct": "D) são elaborados para o médico, uma vez que ele tem conhecimento das atividades comerciais e econômicas e revisa e analisa as informações de modo diligente.", "comment": "Compreensibilidade considera usuários com conhecimento razoável de negócios e economia, que analisam as informações com diligência."}, {"num": 17, "front": "TEMPESTIVIDADE\n\nO que significa tempestividade?", "gab": "B", "correct": "B) tomadores de decisões – influenciar.", "comment": "Tempestividade é disponibilizar informação a tempo de ela ser capaz de influenciar decisões."}, {"num": 18, "front": "INFORMAÇÃO FORA DO TEMPO\n\nO que acontece quando a informação é divulgada tarde demais?", "gab": "A", "correct": "A) utilidade.", "comment": "Informação divulgada tarde pode perder utilidade. Essa é a essência da tempestividade."}, {"num": 19, "front": "PRUDÊNCIA\n\nComo prudência se relaciona com neutralidade e incerteza?", "gab": "B", "correct": "B) ser prudente.", "comment": "Neutralidade não significa ausência de prudência. Prudência é cautela em julgamentos sob incerteza."}, {"num": 20, "front": "COMPARABILIDADE\n\nPara que servem informações comparativas entre períodos?", "gab": "D", "correct": "D) fornecem informações comparativas de, pelo menos, um período de relatório anterior.", "comment": "Informações comparativas ajudam a identificar mudanças, semelhanças e tendências entre períodos."}, {"num": 21, "front": "BASES DE MENSURAÇÃO\n\nComo consistência, compreensibilidade e verificabilidade influenciam a mensuração?", "gab": "D", "correct": "D) F – V – V.", "comment": "Consistência favorece comparabilidade; mudança de base pode ser justificada; verificabilidade pode ocorrer direta ou indiretamente."}, {"num": 22, "front": "ELEMENTOS CONTÁBEIS\n\nQual é o ponto central para diferenciar ativo, passivo, receita e despesa?", "gab": "A", "correct": "A) F – F – V – V.", "comment": "Ativo não exige propriedade jurídica, mas controle. Passivo é obrigação presente. Receita e despesa afetam o PL pelas mudanças em ativos/passivos."}, {"num": 23, "front": "RESTRIÇÃO DO CUSTO\n\nQuando o custo de produzir informação pode não se justificar?", "gab": "D", "correct": "D) os custos foram maiores do que os benefícios.", "comment": "Se o custo adicional da informação não é compensado por benefício percebido, evidencia-se a restrição do custo."}, {"num": 24, "front": "CONTINUIDADE\n\nO que ocorre quando a entidade pretende liquidar suas atividades?", "gab": "E", "correct": "E) incorreto, uma vez que as demonstrações contábeis podem ter que ser elaboradas em base diferente.", "comment": "Se a entidade pretende liquidar suas atividades, a continuidade operacional pode deixar de ser base apropriada."}, {"num": 25, "front": "CONTROLE DO ATIVO\n\nControle é a mesma coisa que posse física ou propriedade jurídica?", "gab": "A", "correct": "A) Posse física legal.", "comment": "Controle não se confunde com mera posse física legal; importa a capacidade de direcionar o uso e obter benefícios econômicos."}, {"num": 26, "front": "VERIFICABILIDADE\n\nO que caracteriza uma verificação indireta?", "gab": "E", "correct": "E) Verificação do valor contábil do estoque por meio da conferência das entradas e do recálculo do estoque final utilizando o mesmo método de mensuração.", "comment": "Verificação indireta: conferir dados de entrada e recalcular o resultado usando o mesmo método."}, {"num": 27, "front": "CARACTERÍSTICAS QUALITATIVAS\n\nQuais são fundamentais e qual é de melhoria?", "gab": "C", "correct": "C) relevante, mas não comparável.", "comment": "Relevância e representação fidedigna são fundamentais; comparabilidade é característica de melhoria."}, {"num": 28, "front": "LIQUIDAÇÃO DA ENTIDADE\n\nUma decisão de liquidar a entidade afeta qual pressuposto?", "gab": "B", "correct": "B) sem utilizar o pressuposto de continuidade.", "comment": "Decisão de liquidar a entidade antes da autorização das demonstrações pode tornar inadequado o pressuposto de continuidade."}, {"num": 29, "front": "PATRIMÔNIO LÍQUIDO\n\nComplete: PL é a participação residual...", "gab": "A", "correct": "A) nos ativos após a dedução de todos os seus passivos.", "comment": "PL = participação residual nos ativos após a dedução de todos os passivos."}, {"num": 30, "front": "PRUDÊNCIA\n\nO que significa prudência em condições de incerteza?", "gab": "C", "correct": "C) determinados pronunciamentos podem conter requisitos assimétricos, como, por exemplo, provisões e ativos contingentes;", "comment": "Prudência é cautela sob incerteza e pode aparecer em tratamentos assimétricos previstos em normas específicas."}, {"num": 31, "front": "CUSTO × BENEFÍCIO\n\nQual é a regra para justificar o custo da informação?", "gab": "E", "correct": "E) benefícios de apresentar essas informações.", "comment": "Os custos de fornecer informação devem ser justificados pelos benefícios esperados."}, {"num": 32, "front": "CONSISTÊNCIA\n\nAplicar políticas contábeis consistentemente favorece qual característica?", "gab": "D", "correct": "D) Comparabilidade.", "comment": "Aplicar políticas contábeis consistentemente ao longo do tempo favorece a comparabilidade."}, {"num": 33, "front": "ESSÊNCIA ECONÔMICA\n\nO que a informação deve representar fidedignamente?", "gab": "E", "correct": "E) representar de forma fidedigna a essência dos fenômenos que pretendem representar.", "comment": "Informação útil deve representar fidedignamente a essência econômica do fenômeno que pretende representar."}, {"num": 34, "front": "USUÁRIOS PRIMÁRIOS\n\nPor que os relatórios são tão importantes para investidores e credores?", "gab": "E", "correct": "E) não podem exigir que as entidades que reportam forneçam informações diretamente a eles.", "comment": "Usuários primários dependem dos relatórios porque, em geral, não podem exigir informação diretamente da entidade."}, {"num": 35, "front": "EFICIÊNCIA ECONÔMICA\n\nComo a informação contábil ajuda investidores e a alocação de capital?", "gab": "B", "correct": "B) identificar oportunidades e riscos em todo o mundo, melhorando a alocação de capital.", "comment": "Eficiência econômica: identificar oportunidades e riscos globalmente melhora a alocação de capital."}, {"num": 36, "front": "LINGUAGEM CONTÁBIL ÚNICA\n\nQual benefício pode resultar de uma linguagem contábil única e confiável?", "gab": "C", "correct": "C) do uso de linguagem de contabilidade única e confiável.", "comment": "Linguagem contábil única e confiável aumenta comparabilidade e confiança e pode reduzir o custo de capital."}, {"num": 37, "front": "PONTO DE VISTA DA ENTIDADE\n\nDe qual ponto de vista são apresentados transações e eventos?", "gab": "B", "correct": "B) entidade que reporta como um todo.", "comment": "As demonstrações apresentam transações e eventos do ponto de vista da entidade que reporta como um todo."}, {"num": 38, "front": "COMPARABILIDADE\n\nO que a comparabilidade permite identificar?", "gab": "D", "correct": "D) Comparabilidade.", "comment": "Comparabilidade permite identificar semelhanças e diferenças entre períodos ou entidades."}, {"num": 39, "front": "RELEVÂNCIA\n\nQuando uma informação é considerada relevante?", "gab": "C", "correct": "C) ter valor confirmatório, preditivo ou ambos.", "comment": "Informação relevante faz diferença nas decisões quando possui valor preditivo, confirmatório ou ambos."}, {"num": 40, "front": "DESRECONHECIMENTO\n\nQuando uma máquina deve sair do balanço por deixar de ser ativo?", "gab": "A", "correct": "A) perder todo o potencial de produzir benefícios econômicos para a entidade.", "comment": "Desreconhecimento retira o item do balanço quando deixa de atender à definição. A máquina sai quando perde todo potencial de produzir benefícios econômicos."}]</script>
<script>
const cards = JSON.parse(document.getElementById('cards-data').textContent);
let i=0, flipped=false;
const card=document.getElementById('card');
const question=document.getElementById('question');
const answer=document.getElementById('answer');
const comment=document.getElementById('comment');
const count=document.getElementById('count');
const bar=document.getElementById('bar');

function render(){
  const x=cards[i];
  question.textContent=x.front;
  answer.textContent=x.correct;
  comment.innerHTML='<b>COMENTÁRIO:</b><br>'+x.comment;
  count.textContent='FLASHCARD '+(i+1)+' DE '+cards.length+' • QUESTÃO '+String(x.num).padStart(2,'0');
  bar.style.width=((i+1)/cards.length*100)+'%';
  card.classList.toggle('flipped',flipped);
}
function turn(){flipped=!flipped; card.classList.toggle('flipped',flipped);}
card.addEventListener('click',turn);
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn();}});
document.getElementById('prev').onclick=()=>{if(i>0)i--;flipped=false;render();window.scrollTo(0,0);};
document.getElementById('next').onclick=()=>{if(i<cards.length-1)i++;flipped=false;render();window.scrollTo(0,0);};
document.getElementById('reset').onclick=()=>{i=0;flipped=false;render();window.scrollTo(0,0);};
render();
</script>
</body>
</html>
